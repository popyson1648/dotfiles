name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run verification
        run: python3 scripts/verify.py --mode ci

      - name: Exercise installer
        run: |
          test_home="$(mktemp -d)"
          HOME="$test_home" python3 scripts/link-home.py --dry-run
          HOME="$test_home" python3 scripts/link-home.py
          HOME="$test_home" python3 scripts/link-home.py --check

  verify-wsl:
    name: Verify (WSL Ubuntu 24.04)
    runs-on: windows-2025
    steps:
      - name: Preserve Unix line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6

      - name: Set up Ubuntu under WSL
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          additional-packages: python3

      - name: Run verification in WSL
        shell: wsl-bash {0}
        run: |
          python3 -c 'import importlib.util, pathlib, sys; p=pathlib.Path("scripts/link-home.py"); s=importlib.util.spec_from_file_location("link_home", p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m); assert m.detect_platform() == "wsl"'
          python3 scripts/verify.py --mode ci

      - name: Exercise installer in WSL
        shell: wsl-bash {0}
        run: |
          test_home="$(mktemp -d)"
          HOME="$test_home" python3 scripts/link-home.py --dry-run
          HOME="$test_home" python3 scripts/link-home.py
          HOME="$test_home" python3 scripts/link-home.py --check
